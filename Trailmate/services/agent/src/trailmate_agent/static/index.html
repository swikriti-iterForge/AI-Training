<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrailMate</title>
<!--
  TrailMate chat UI. One file, no libraries, no network calls except to this same server, so it works offline.
  It talks to POST /chat and reads the answer as it streams (Server-Sent Events). Everything shown on screen is
  inserted as plain text (never parsed as HTML), so text from the model or the user can never run as code.
  Saved chats and "what I remember" belong to the NAME in the header; untick "Remember me" to chat without
  saving anything.
-->
<style>
:root {
  --bg: #f6f4ee; --panel: #ffffff; --ink: #1d2b24; --muted: #5d6b63; --line: #dcd8cc;
  --green: #1f5d45; --green-ink: #ffffff; --sage: #e4ede6; --user: #1f5d45; --user-ink: #ffffff;
  --warn: #7a4300; --warn-bg: #fff3e0; --err: #a12626; --err-bg: #fdeaea;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121a16; --panel: #1b2620; --ink: #e8efe9; --muted: #9db0a4; --line: #2c3b33;
    --green: #5fb58c; --green-ink: #0d1a13; --sage: #22322a; --user: #2f7a58; --user-ink: #ffffff;
    --warn: #ffcf8a; --warn-bg: #3a2a12; --err: #ff9a9a; --err-bg: #3a1818;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { display: flex; height: 100%; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ---------- sidebar: history and memory ---------- */
#side {
  width: 270px; flex: none; display: flex; flex-direction: column; gap: .7rem; padding: .8rem;
  background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto;
}
#side h2 { margin: .4rem 0 .1rem; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
#newchat { background: var(--green); color: var(--green-ink); border: 0; border-radius: 10px; padding: .55rem .8rem; font-weight: 600; cursor: pointer; }
#history { display: flex; flex-direction: column; gap: .2rem; }
.hist { display: flex; align-items: center; gap: .2rem; border-radius: 10px; border: 1px solid transparent; }
.hist.active { background: var(--sage); border-color: var(--line); }
.hist .open { flex: 1; min-width: 0; text-align: left; background: transparent; border: 0; padding: .4rem .55rem; cursor: pointer; border-radius: 10px; display: flex; flex-direction: column; }
.hist .open .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist .open small { color: var(--muted); }
.hist .del { background: transparent; border: 0; color: var(--muted); cursor: pointer; padding: .3rem .5rem; border-radius: 8px; font-size: .8rem; }
.hist .del:hover, .hist .del[data-armed] { color: var(--err); background: var(--err-bg); }
.muted { color: var(--muted); font-size: .85rem; margin: .2rem 0; }
#memory { margin-top: auto; border-top: 1px solid var(--line); padding-top: .6rem; }
#memory p { margin: .2rem 0 .5rem; font-size: .9rem; }
#forget { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: .25rem .6rem; cursor: pointer; font-size: .85rem; }
#forget[data-armed] { border-color: var(--err); color: var(--err); }
#forget:disabled { opacity: .45; cursor: default; }
#sidetoggle { display: none; }
@media (max-width: 820px) {
  #side { position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; width: min(290px, 86vw); transform: translateX(-102%); transition: transform .18s; }
  body.side-open #side { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); }
  #sidetoggle { display: inline-block; }
}
@media (prefers-reduced-motion: reduce) { #side { transition: none; } }

/* ---------- header ---------- */
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding: .6rem 1rem;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
header h1 { margin: 0; font-size: 1.15rem; color: var(--green); letter-spacing: .01em; }
header h1 small { font-weight: 400; color: var(--muted); font-size: .8rem; margin-left: .4rem; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .8rem; margin-left: auto; font-size: .85rem; }
.controls label { display: inline-flex; align-items: center; gap: .3rem; color: var(--muted); }
.controls select, .controls input[type=text] { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: .25rem .45rem; max-width: 9rem; }
.controls button { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: .25rem .7rem; cursor: pointer; }

/* ---------- conversation ---------- */
#chat { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
.wrap { width: 100%; max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
.msg { display: flex; flex-direction: column; gap: .4rem; max-width: 100%; }
.msg.user { align-items: flex-end; }
.bubble { padding: .65rem 1rem; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 100%; }
.msg.user .bubble { background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; }
.msg.assistant .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.status { color: var(--muted); font-size: .9rem; display: flex; align-items: center; gap: .5rem; }
.dots span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin-right: 3px; animation: blink 1.2s infinite both; }
.dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: .6; } }
.warm { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: .3rem .6rem; }

.cards { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.cards:empty { display: none; }
.card { border: 1px solid var(--line); background: var(--sage); border-radius: 14px; padding: .7rem .85rem; }
.card h3 { margin: 0 0 .15rem; font-size: 1rem; }
.card .facts { font-weight: 600; color: var(--green); font-size: .9rem; }
.card p { margin: .25rem 0 0; font-size: .85rem; color: var(--muted); }
.card button { margin-top: .5rem; }
.actions { display: flex; flex-wrap: wrap; gap: .4rem; }
.actions:empty { display: none; }
button.act, button.chip { background: var(--panel); border: 1px solid var(--green); color: var(--green); border-radius: 999px; padding: .25rem .8rem; cursor: pointer; font-size: .88rem; }
button.act:hover, button.chip:hover { background: var(--green); color: var(--green-ink); }
button.act:disabled { opacity: .45; cursor: default; background: transparent; color: var(--muted); border-color: var(--line); }

.error { background: var(--err-bg); color: var(--err); border-radius: 12px; padding: .6rem .9rem; display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
.error button { border: 1px solid var(--err); background: transparent; color: var(--err); border-radius: 8px; padding: .2rem .7rem; cursor: pointer; }

.debug { font: .78rem/1.4 ui-monospace, Consolas, monospace; color: var(--muted); }
.debug summary { cursor: pointer; }
.debug pre { margin: .3rem 0 0; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: .5rem; }
body:not(.debug) .debug { display: none; }

#empty { text-align: center; margin: auto; padding: 2rem 1rem; max-width: 560px; }
#empty h2 { margin: 0 0 .3rem; color: var(--green); }
#empty p { color: var(--muted); margin: 0 0 1rem; }
#empty .chips { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; }

form { display: flex; gap: .5rem; padding: .7rem 1rem; background: var(--panel); border-top: 1px solid var(--line); }
form .inner { display: flex; gap: .5rem; width: 100%; max-width: 820px; margin: 0 auto; }
#input { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: .6rem .8rem; min-width: 0; }
#send { background: var(--green); color: var(--green-ink); border: 0; border-radius: 12px; padding: .6rem 1.1rem; cursor: pointer; font-weight: 600; }
#send:disabled, #input:disabled { opacity: .55; cursor: default; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 560px) { .controls { margin-left: 0; } .controls input[type=text] { max-width: 6rem; } }
</style>
</head>
<body>
<div class="app">
  <aside id="side" aria-label="Chat history and memory">
    <button id="newchat" type="button">+ New chat</button>
    <h2>History</h2>
    <nav id="history" aria-label="Saved chats"></nav>
    <p id="histnote" class="muted" hidden></p>
    <section id="memory" aria-label="What I remember about you">
      <h2>What I remember</h2>
      <p id="memtext" class="muted">Nothing yet. I learn from what you ask for.</p>
      <button id="forget" type="button" disabled>Forget what I know</button>
    </section>
  </aside>

  <div class="main">
    <header>
      <button id="sidetoggle" type="button" aria-label="Show chat history">History</button>
      <h1>TrailMate<small>find a trail that fits</small></h1>
      <div class="controls">
        <label>Mode
          <select id="mode" aria-label="Mode">
            <option value="agent">Agent</option>
            <option value="workflow">Workflow (Phase 1)</option>
          </select>
        </label>
        <label>Model <select id="tier" aria-label="Model tier"><option value="">default</option></select></label>
        <label>Name <input id="user" type="text" maxlength="64" placeholder="me" aria-label="Your name: chats and memory are saved under it"></label>
        <label><input id="remember" type="checkbox" checked> Remember me</label>
        <label><input id="debug" type="checkbox"> Debug</label>
        <button id="reset" type="button">New chat</button>
      </div>
    </header>

    <div id="chat" role="log" aria-label="Conversation" aria-live="polite" aria-busy="false">
      <div class="wrap" id="wrap">
        <div id="empty">
          <h2>Where would you like to hike?</h2>
          <p>Describe what you're after. Say how hard it should be and what you'd like to see. I only know the trails in my data, and I'll say when I can't tell.</p>
          <div class="chips" id="suggestions"></div>
        </div>
      </div>
    </div>

    <form id="form" autocomplete="off">
      <div class="inner">
        <label for="input" class="sr">Message</label>
        <input id="input" type="text" placeholder="e.g. an easy waterfall hike" required>
        <button id="send" type="submit">Send</button>
      </div>
    </form>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const chat = $("chat"), wrap = $("wrap"), empty = $("empty"), form = $("form"), input = $("input"), sendBtn = $("send");
  const modeSel = $("mode"), tierSel = $("tier"), userInput = $("user"), debugBox = $("debug"), rememberBox = $("remember");
  const histEl = $("history"), histNote = $("histnote"), memBox = $("memory"), memText = $("memtext"), forgetBtn = $("forget");
  const ORDINALS = ["first", "second", "third"];
  const ID_OK = /^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$/; // must start with a letter or digit (matches the server)
  const SUGGESTIONS = [
    "I want an easy waterfall hike", "A hard scramble with a view", "A short dog-friendly walk",
    "quiet version of the popular waterfall hike",
  ];
  const store = {
    get(k) { try { return localStorage.getItem("trailmate." + k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem("trailmate." + k, v); } catch { /* private mode: fine */ } },
  };
  const sess = {
    get() { try { return sessionStorage.getItem("trailmate.session"); } catch { return null; } },
    set(v) { try { v ? sessionStorage.setItem("trailmate.session", v) : sessionStorage.removeItem("trailmate.session"); } catch { /* ignore */ } },
  };
  let busy = false;
  let session = sess.get();

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text; // plain text only: never parsed as HTML
    return n;
  }
  const scrollDown = () => { chat.scrollTop = chat.scrollHeight; };
  async function api(path, options) {
    const response = await fetch(path, options);
    if (!response.ok) { const e = new Error("http"); e.status = response.status; throw e; }
    return response.json();
  }

  // ---------- who is chatting ----------
  userInput.value = store.get("user") || "me"; // same default as scripts/chat.py
  modeSel.value = store.get("mode") || "agent";
  rememberBox.checked = store.get("remember") !== "0";
  debugBox.checked = store.get("debug") === "1";
  document.body.classList.toggle("debug", debugBox.checked);
  function userId() {
    const v = userInput.value.trim();
    return rememberBox.checked && ID_OK.test(v) ? v : null; // null = nothing is saved or learned
  }
  const enc = encodeURIComponent;

  // ---------- sidebar: history ----------
  function when(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toDateString() === new Date().toDateString()
      ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
      : d.toLocaleDateString([], { day: "numeric", month: "short" });
  }
  // A two-step button: the first click arms it, the second does it (no pop-up dialogs).
  function twoStep(button, armedLabel, action) {
    const normal = button.textContent;
    let timer = null;
    button.addEventListener("click", () => {
      if (button.dataset.armed) { clearTimeout(timer); delete button.dataset.armed; button.textContent = normal; action(); return; }
      button.dataset.armed = "1"; button.textContent = armedLabel;
      timer = setTimeout(() => { delete button.dataset.armed; button.textContent = normal; }, 3500);
    });
  }
  // Each refresh gets a number; a slow older answer must never overwrite a newer one (e.g. after switching name quickly).
  let histRun = 0, memRun = 0;
  async function refreshHistory() {
    const run = ++histRun;
    const u = userId();
    if (!u) {
      histEl.replaceChildren();
      histNote.hidden = false;
      histNote.textContent = rememberBox.checked
        ? "Enter a name (letters and digits) to save your chats."
        : "Remember me is off: nothing is saved or learned.";
      return;
    }
    let list = [];
    try { list = await api(`/conversations/${enc(u)}`); } catch { return; }
    if (run !== histRun) return;
    // Build the new rows first and swap them in at once, so the list never flickers empty while refreshing.
    const rows = list.map((c) => {
      const row = el("div", "hist" + (c.id === session ? " active" : ""));
      const open = el("button", "open");
      open.type = "button";
      open.append(el("span", "t", c.title || "Chat"), el("small", "", when(c.updated)));
      open.addEventListener("click", () => openChat(c.id));
      const del = el("button", "del", "\u00d7");
      del.type = "button";
      del.setAttribute("aria-label", `Delete chat: ${c.title || "Chat"}`);
      twoStep(del, "Delete?", () => removeChat(c.id));
      row.append(open, del);
      return row;
    });
    histEl.replaceChildren(...rows);
    histNote.hidden = rows.length > 0;
    if (!rows.length) histNote.textContent = "No saved chats yet.";
  }
  async function refreshMemory() {
    const run = ++memRun;
    const u = userId();
    memBox.hidden = !u;
    if (!u) return;
    let m;
    try { m = await api(`/memory/${enc(u)}`); } catch { return; }
    if (run !== memRun) return;
    if (m.known_text) memText.textContent = `I remember: ${m.known_text}.` + (m.asked_text ? ` You've asked for: ${m.asked_text}.` : "");
    else if (m.asked_text) memText.textContent = `Not sure yet. So far you've asked for: ${m.asked_text}.`;
    else memText.textContent = "Nothing yet. I learn from what you ask for.";
    forgetBtn.disabled = !(m.known_text || m.asked_text);
  }
  const refreshSide = () => { refreshHistory(); refreshMemory(); };
  twoStep(forgetBtn, "Click again to forget", async () => {
    const u = userId();
    if (!u) return;
    try { await api(`/memory/${enc(u)}`, { method: "DELETE" }); } catch { /* shown on refresh */ }
    refreshMemory();
  });
  async function removeChat(id) {
    const u = userId();
    if (!u) return;
    try { await api(`/conversations/${enc(u)}/${enc(id)}`, { method: "DELETE" }); } catch { /* list refresh shows the truth */ }
    if (id === session) newChat();
    else refreshHistory();
  }
  const closeSide = () => document.body.classList.remove("side-open");
  $("sidetoggle").addEventListener("click", () => document.body.classList.toggle("side-open"));

  // ---------- starting, switching and reopening chats ----------
  function clearMessages() {
    for (const m of [...wrap.querySelectorAll(".msg")]) m.remove();
    empty.hidden = false;
  }
  function newChat() {
    if (busy) return;
    session = null; sess.set(null);
    clearMessages();
    refreshHistory();
    closeSide();
    input.focus();
  }
  async function openChat(id) {
    const u = userId();
    if (busy || !u) return;
    let saved;
    try { saved = await api(`/conversations/${enc(u)}/${enc(id)}`); }
    catch (err) { if (err.status === 404) { session = null; sess.set(null); refreshHistory(); } return; }
    clearMessages();
    session = saved.id; sess.set(session);
    empty.hidden = true;
    renderStored(saved.messages || []);
    refreshHistory();
    closeSide();
    scrollDown();
    input.focus();
  }
  function renderStored(messages) {
    let lastResults = null;
    for (const m of messages) {
      if (m.role === "user") {
        const row = el("div", "msg user");
        row.appendChild(el("div", "bubble", m.text));
        wrap.appendChild(row);
      } else {
        const ui = blankAssistant();
        wrap.appendChild(ui.root);
        showText(ui, m.text || "");
        if (m.trails && m.trails.length) { renderCards(ui, m.trails); lastResults = ui; }
      }
    }
    if (lastResults) addMoreButton(lastResults); // only the latest results can be continued
  }
  $("reset").addEventListener("click", newChat);
  $("newchat").addEventListener("click", newChat);
  userInput.addEventListener("change", () => { store.set("user", userInput.value.trim()); newChat(); refreshSide(); });
  rememberBox.addEventListener("change", () => { store.set("remember", rememberBox.checked ? "1" : "0"); newChat(); refreshSide(); });
  modeSel.addEventListener("change", () => store.set("mode", modeSel.value));
  tierSel.addEventListener("change", () => store.set("tier", tierSel.value));
  debugBox.addEventListener("change", () => {
    store.set("debug", debugBox.checked ? "1" : "0");
    document.body.classList.toggle("debug", debugBox.checked);
  });
  fetch("/health").then((r) => r.json()).then((h) => {
    for (const t of h.tiers || []) tierSel.appendChild(el("option", "", t)).value = t;
    tierSel.value = store.get("tier") || "";
  }).catch(() => { /* the first message will show a clear error */ });

  for (const text of SUGGESTIONS) {
    const b = el("button", "chip", text);
    b.type = "button";
    b.addEventListener("click", () => send(text));
    $("suggestions").appendChild(b);
  }

  // ---------- one assistant message ----------
  function blankAssistant() {
    const root = el("div", "msg assistant");
    const ui = {
      root, raw: "", gotText: false, hasCards: false, timer: null,
      status: el("div", "status"), bubble: el("div", "bubble"), cards: el("div", "cards"),
      actions: el("div", "actions"), debug: el("div", "debug"),
    };
    ui.status.hidden = true;
    ui.bubble.hidden = true;
    root.append(ui.status, ui.bubble, ui.cards, ui.actions, ui.debug);
    return ui;
  }
  function assistantShell() {
    const ui = blankAssistant();
    setStatus(ui, "TrailMate is thinking", true);
    // The first request after idle loads the model, which can take ~20 s. Say so, instead of looking frozen.
    ui.timer = setTimeout(() => {
      setStatus(ui, "Waking up the model. The first answer can take about 20 seconds.", true, true);
    }, 6000);
    return ui;
  }
  function setStatus(ui, label, dots, warm) {
    ui.status.hidden = false;
    ui.status.replaceChildren();
    if (dots) {
      const d = el("span", "dots");
      d.append(el("span"), el("span"), el("span"));
      d.setAttribute("aria-hidden", "true");
      ui.status.appendChild(d);
    }
    ui.status.appendChild(el("span", warm ? "warm" : "", label));
  }
  function stopWaiting(ui) { clearTimeout(ui.timer); }
  function hideStatus(ui) { stopWaiting(ui); ui.status.hidden = true; ui.status.replaceChildren(); }
  function showText(ui, text) {
    ui.raw = text;
    ui.bubble.textContent = text;
    ui.bubble.hidden = !text;
    scrollDown();
  }
  function addMoreButton(ui) {
    const more = el("button", "act", "Show me more");
    more.type = "button";
    more.addEventListener("click", () => send("show me more"));
    ui.actions.appendChild(more);
  }

  // ---------- trail cards ----------
  function staleOlderResults() {
    for (const b of wrap.querySelectorAll("button.act")) { b.disabled = true; b.dataset.stale = "1"; }
  }
  function renderCards(ui, trails) {
    staleOlderResults(); // "the second one" always means the LATEST list, so older buttons stop working
    ui.cards.replaceChildren();
    trails.forEach((t, i) => {
      const f = t.facts, card = el("article", "card");
      card.append(
        el("h3", "", `${i + 1}. ${t.name}`),
        el("div", "facts", `${f.difficulty} \u00b7 ${f.distance_km} km \u00b7 ${f.elevation_gain_m} m climb`),
        el("p", "", `Best for: ${f.best_for.join(", ")}`),
        el("p", "", `Dogs: ${f.dogs_allowed}`),
      );
      const more = el("button", "act", "Tell me more");
      more.type = "button";
      more.addEventListener("click", () => send(`tell me about the ${ORDINALS[i]} one`));
      card.appendChild(more);
      ui.cards.appendChild(card);
    });
    ui.hasCards = trails.length > 0;
    scrollDown();
  }

  // ---------- finishing, errors ----------
  function finish(ui, done) {
    hideStatus(ui);
    if (!ui.raw) showText(ui, "(no reply)");
    if (ui.hasCards) addMoreButton(ui);
    const call = (done.tool_calls || [])[0];
    const bits = [done.mode, done.decision || done.category || "-", `${((done.total_ms || 0) / 1000).toFixed(1)} s`];
    if (call && call.query) bits.push(`search("${call.query}"${call.difficulty ? ", " + call.difficulty.join("/") : ""})`);
    const det = el("details");
    det.append(el("summary", "", bits.join(" \u00b7 ")), el("pre", "", JSON.stringify({
      route: done.category, decision: done.decision, reply_source: done.reply_source, error: done.error,
      tool_calls: done.tool_calls, trace: done.trace, timings_ms: done.timings_ms,
      session_id: done.session_id, request_id: done.request_id,
    }, null, 2)));
    ui.debug.appendChild(det);
    scrollDown();
  }
  function fail(ui, message, retryText) {
    hideStatus(ui);
    const box = el("div", "error");
    box.setAttribute("role", "alert");
    box.appendChild(el("span", "", message));
    const retry = el("button", "", "Try again");
    retry.type = "button";
    retry.addEventListener("click", () => send(retryText, ui));
    box.appendChild(retry);
    ui.root.insertBefore(box, ui.actions);
    scrollDown();
  }
  function friendly(err) {
    if (err && err.status === 422) return "The agent could not accept that request. Try rewording it.";
    if (err && err.status) return `The agent answered with an error (HTTP ${err.status}). Check its terminal.`;
    if (err && err.interrupted) return "The connection was interrupted before the answer finished.";
    return "Can't reach the agent. Is it running on this address?";
  }

  // ---------- reading the stream (Server-Sent Events) ----------
  function parseBlock(block) {
    let event = "message";
    const data = [];
    for (const line of block.split("\n")) {
      if (line.startsWith(":")) continue; // a keep-alive comment
      if (line.startsWith("event:")) event = line.slice(6).trim();
      else if (line.startsWith("data:")) data.push(line.slice(5).replace(/^ /, ""));
    }
    if (!data.length) return null;
    try { return { event, data: JSON.parse(data.join("\n")) }; } catch { return null; }
  }
  function handle(ui, event, data, state) {
    if (event === "meta") { session = data.session_id || session; sess.set(session); }
    else if (event === "tool") {
      stopWaiting(ui);
      if (!ui.gotText) setStatus(ui, data.label || "Working...", data.status === "start");
    } else if (event === "results") renderCards(ui, data.trails || []);
    else if (event === "token") {
      stopWaiting(ui);
      if (!ui.gotText) { ui.gotText = true; hideStatus(ui); }
      showText(ui, ui.raw + data.text);
    } else if (event === "replace") { ui.gotText = true; hideStatus(ui); showText(ui, data.text); }
    else if (event === "done") { state.done = true; finish(ui, data); }
    else if (event === "error") { state.error = data.message || "Something went wrong on the server."; }
  }
  async function stream(payload, ui) {
    const response = await fetch("/chat", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
    });
    if (!response.ok) { const e = new Error("http"); e.status = response.status; throw e; }
    const reader = response.body.getReader(), decoder = new TextDecoder();
    const state = { done: false, error: null };
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer = (buffer + decoder.decode(value, { stream: true })).replace(/\r\n/g, "\n");
      let i;
      while ((i = buffer.indexOf("\n\n")) >= 0) {
        const parsed = parseBlock(buffer.slice(0, i));
        buffer = buffer.slice(i + 2);
        if (parsed) handle(ui, parsed.event, parsed.data, state);
      }
    }
    if (state.error) throw Object.assign(new Error(state.error), { server: true });
    if (!state.done) throw Object.assign(new Error("interrupted"), { interrupted: true });
  }

  // ---------- sending ----------
  function setBusy(on) {
    busy = on;
    input.disabled = sendBtn.disabled = on;
    chat.setAttribute("aria-busy", on ? "true" : "false");
    for (const b of document.querySelectorAll("button.act:not([data-stale])")) b.disabled = on;
  }
  async function send(text, retryUi) {
    text = (text || "").trim();
    if (!text || busy) return;
    setBusy(true);
    empty.hidden = true;
    if (retryUi) retryUi.root.remove();
    else {
      const m = el("div", "msg user");
      m.appendChild(el("div", "bubble", text));
      wrap.appendChild(m);
    }
    const ui = assistantShell();
    wrap.appendChild(ui.root);
    scrollDown();
    const payload = { message: text, mode: modeSel.value };
    if (tierSel.value) payload.model = tierSel.value;
    if (userId()) payload.user_id = userId();
    if (session) payload.session_id = session;
    let ok = true;
    try { await stream(payload, ui); }
    catch (err) { ok = false; fail(ui, err.server ? err.message : friendly(err), text); }
    setBusy(false);
    if (ok) refreshSide(); // the saved chat and what was learned are on the server by now
    input.focus();
  }
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value;
    input.value = ""; // cleared at once; if sending fails, "Try again" resends it
    send(text);
  });

  // ---------- on load: show the list, and reopen the chat this tab was in (a refresh keeps it) ----------
  refreshSide();
  if (session && userId()) openChat(session);
  else if (session) { session = null; sess.set(null); }
  input.focus();
})();
</script>
</body>
</html>
